name: Build HTTPCustom (aarch64 & x86_64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openwrt_version: [ "25.12.2", "24.10.4" ]
        target:
          - name: "aarch64"
            path: "mediatek/filogic"
          - name: "x86_64"
            path: "x86/64"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd

    - name: Fetch OpenWrt SDK (${{ matrix.openwrt_version }} - ${{ matrix.target.name }})
      run: |
        BASE_URL="https://openwrt.org{{ matrix.openwrt_version }}/targets/${{ matrix.target.path }}"
        
        SDK_FILE=$(curl -s "$BASE_URL/sha256sums" | grep "openwrt-sdk" | grep -E "\.tar\.(xz|zst)" | awk '{print $2}' | sed 's/*//g')
        
        if [ -z "$SDK_FILE" ]; then
          echo "Fatal Error: Cannot resolve SDK filename from $BASE_URL"
          exit 1
        fi
        
        echo "Downloading $SDK_FILE..."
        wget -q "$BASE_URL/$SDK_FILE"
        tar -xf "$SDK_FILE"
        mv openwrt-sdk-*/ openwrt-sdk/

    - name: Prepare Package & Update Feeds
      run: |
        mkdir -p openwrt-sdk/package/luci-app-httpcustom
        rsync -av --exclude='.github' --exclude='openwrt-sdk' --exclude='*.tar.*' . openwrt-sdk/package/luci-app-httpcustom/
        
        cd openwrt-sdk
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        make defconfig

    - name: Compile Package
      run: |
        cd openwrt-sdk
        make package/luci-app-httpcustom/compile V=s

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: luci-app-httpcustom-${{ matrix.target.name }}-openwrt-${{ matrix.openwrt_version }}
        path: openwrt-sdk/bin/packages/**/luci-app-httpcustom*.*pk
        retention-days: 7
