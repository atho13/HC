name: Build HTTPCustom (Amlogic aarch64 & x86_64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. aarch64 - IPK (OpenWrt 24.10.8)
          - arch: aarch64_generic
            format: ipk
            base_url: https://downloads.openwrt.org/releases/24.10.8/targets/armsr/armv8/
          # 2. aarch64 - APK (OpenWrt 25.12.6)
          - arch: aarch64_generic
            format: apk
            base_url: https://downloads.openwrt.org/releases/25.12.6/targets/armsr/armv8/
          # 3. x86_64 - IPK (OpenWrt 24.10.8)
          - arch: x86_64
            format: ipk
            base_url: https://downloads.openwrt.org/releases/24.10.8/targets/x86/64/
          # 4. x86_64 - APK (OpenWrt 25.12.6)
          - arch: x86_64
            format: apk
            base_url: https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/


    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd

    - name: Fetch OpenWrt SDK (${{ matrix.name }})
      run: |
        BASE_URL="${{ matrix.url }}"
        echo "Fetching sha256sums from $BASE_URL..."
        
        SDK_FILE=$(curl -fsSL "$BASE_URL/sha256sums" | grep "openwrt-sdk-" | grep -E "\.tar\.(xz|zst)" | awk '{print $2}' | sed 's/\*//g' | head -n 1)
        
        if [ -z "$SDK_FILE" ]; then
          echo "Fatal Error: Cannot resolve SDK filename from $BASE_URL"
          exit 1
        fi
        
        echo "Downloading $BASE_URL/$SDK_FILE..."
        wget -q "$BASE_URL/$SDK_FILE"
        tar -xf "$SDK_FILE"
        mv openwrt-sdk-*/ openwrt-sdk/

    - name: Prepare Package & Update Feeds
      run: |
        mkdir -p openwrt-sdk/package/luci-app-httpcustom
        rsync -av --exclude='.github' --exclude='openwrt-sdk' --exclude='*.tar.*' . openwrt-sdk/package/luci-app-httpcustom/
        
        cd openwrt-sdk
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        make defconfig

    - name: Compile Package
      run: |
        cd openwrt-sdk
        make package/luci-app-httpcustom/compile V=s

    - name: Upload Artifact (${{ matrix.name }})
      uses: actions/upload-artifact@v4
      with:
        name: luci-app-httpcustom-${{ matrix.name }}
        path: openwrt-sdk/bin/packages/**/luci-app-httpcustom*.*pk
        retention-days: 7
