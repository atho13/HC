name: Build FRDMX Tunnnel

#on:
  #push:
    #branches: [ main, master ]
  #workflow_dispatch:
on:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "aarch64-ipk-24.10.8"
            ver: "24.10.8"
            target: "armsr/armv8"
          - name: "aarch64-apk-25.12.6"
            ver: "25.12.6"
            target: "armsr/armv8"
          - name: "x86_64-ipk-24.10.8"
            ver: "24.10.8"
            target: "x86/64"
          - name: "x86_64-apk-25.12.6"
            ver: "25.12.6"
            target: "x86/64"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd

    - name: Fetch OpenWrt SDK (${{ matrix.name }})
      run: |
        HOST="downloads.openwrt.org"
        DIR="releases/${{ matrix.ver }}/targets/${{ matrix.target }}"
        BASE="https://${HOST}/${DIR}"
        
        echo "Checking $BASE ..."
        SDK_FILE=$(curl -fsSL "${BASE}/sha256sums" | grep "openwrt-sdk-" | grep -E "\.tar\.(xz|zst)" | awk '{print $2}' | sed 's/\*//g' | head -n 1)
        
        if [ -z "$SDK_FILE" ]; then
          echo "Error: SDK file tidak ditemukan di $BASE"
          exit 1
        fi
        
        echo "Downloading $SDK_FILE ..."
        wget -q "${BASE}/${SDK_FILE}"
        tar -xf "$SDK_FILE"
        mv openwrt-sdk-*/ openwrt-sdk/

    - name: Prepare Package & Update Feeds
      run: |
        mkdir -p openwrt-sdk/package/luci-app-frdmxtunnel
        rsync -av --exclude='.github' --exclude='openwrt-sdk' --exclude='*.tar.*' . openwrt-sdk/package/luci-app-frdmxtunnel/
        
        cd openwrt-sdk
        ./scripts/feeds update luci
        ./scripts/feeds install luci-base
        
        cat << 'EOF' > .config
        CONFIG_ALL=n
        CONFIG_ALL_KMODS=n
        CONFIG_ALL_NONSHARED=n
        CONFIG_PACKAGE_luci-app-frdmxtunnel=y
        EOF
        make defconfig

    - name: Compile Package
      run: |
        cd openwrt-sdk
        make package/luci-app-frdmxtunnel/clean V=sc
        make package/luci-app-frdmxtunnel/prepare V=sc
        make -C package/luci-app-frdmxtunnel compile \
          TOPDIR="$PWD" \
          INCLUDE_DIR="$PWD/include" \
          SCRIPT_DIR="$PWD/scripts" \
          V=sc
        make package/index V=sc

    #- name: Compile Package
      #run: |
        #cd openwrt-sdk
        #make package/luci-app-frdmxtunnel/compile IGNORE_ERRORS=1 V=sc
        #make package/index V=sc

    - name: Upload Artifact (${{ matrix.name }})
      uses: actions/upload-artifact@v4
      with:
        name: luci-app-frdmxtunnel-${{ matrix.name }}
        path: openwrt-sdk/bin/packages/**/luci-app-frdmxtunnel*.*pk
        retention-days: 7
